<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGGV - Your Local Community App</title>
    <meta
      name="description"
      content="MyGGV connects you with your local Garden Grove Village community. Download the app to stay informed about local events, news, and connect with neighbors."
    />
    <meta name="theme-color" content="#5bc46d" />
    <meta name="author" content="MyGGV" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://myggv.com/" />

    <!-- Favicon et icônes -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/icon-16x16.png"
    />
    <link rel="apple-touch-icon" href="icons/icon-180x180.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyGGV" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myggv.com/" />
    <meta property="og:title" content="MyGGV - Your Local Community App" />
    <meta
      property="og:description"
      content="Connect with your local Garden Grove Village community. Stay informed about local events, news, and connect with neighbors."
    />
    <meta
      property="og:image"
      content="https://myggv.com/icons/icon-512x512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="MyGGV" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://myggv.com/" />
    <meta name="twitter:title" content="MyGGV - Your Local Community App" />
    <meta
      name="twitter:description"
      content="Connect with your local Garden Grove Village community. Stay informed about local events, news, and connect with neighbors."
    />
    <meta
      name="twitter:image"
      content="https://myggv.com/icons/icon-512x512.png"
    />

    <!-- Preload des images responsives pour de meilleures performances (LCP optimization) -->
    <link
      rel="preload"
      as="image"
      href="images/background-mobile-sm.webp"
      media="(max-width: 480px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/background-mobile-lg.webp"
      media="(min-width: 481px) and (max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/background-tablet.webp"
      media="(min-width: 768px) and (max-width: 1023px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/background-tablet-landscape.webp"
      media="(min-width: 1024px) and (max-width: 1365px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/background-laptop.webp"
      media="(min-width: 1366px) and (max-width: 1919px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/background-desktop.webp"
      media="(min-width: 1920px)"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Madimi+One&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script>
      matchMedia("(prefers-reduced-motion: reduce)").matches ||
        document.documentElement.classList.add("motion");
    </script>
  </head>
  <body class="page-center">
    <canvas class="leaves" aria-hidden="true"></canvas>
    <main class="glass solo" data-reveal="intro">
      <div class="logo" data-float>
        <img
          src="logo.webp"
          alt="Garden Grove Village Logo"
          width="163"
          height="46"
        />
      </div>
      <div class="title" data-reveal="intro">
        <img
          src="title.webp"
          alt="MyGGV"
          width="270"
          height="90"
          fetchpriority="high"
        />
      </div>
      <p class="tagline" data-reveal="intro">Connect with your local community</p>

      <div class="store-buttons" data-reveal="intro">
        <a
          href="https://play.google.com/store/apps/details?id=com.myggv.app"
          class="store-badge"
          aria-label="Get it on Google Play"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="images/badge-playstore.png"
            alt="Get it on Google Play"
            height="52"
          />
        </a>
        <a
          href="https://apps.apple.com/app/myggv/id6757699416"
          class="store-badge"
          aria-label="Download on the App Store"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="images/badge-appstore.svg"
            alt="Download on the App Store"
            height="52"
          />
        </a>
      </div>

      <nav class="links" aria-label="Footer navigation" data-reveal="intro">
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="child-safety.html">Child Safety</a>
        <a href="delete-account.html">Delete Account</a>
        <a href="mailto:support@myggv.com">Contact</a>
      </nav>
    </main>
    <script src="vendor/motion.js" defer></script>
    <script src="animations.js" defer></script>
    <script src="leaves.js" defer></script>
  </body>
</html>
