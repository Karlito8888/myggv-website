<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Join MyGGV</title>
    <meta name="theme-color" content="#5bc46d" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32x32.png" />
    <link rel="apple-touch-icon" href="../icons/icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Madimi+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script>
      matchMedia("(prefers-reduced-motion: reduce)").matches ||
        document.documentElement.classList.add("motion");
    </script>
  </head>
  <body class="page-center">
    <main class="glass solo referral" data-reveal="intro">
      <div class="logo" data-float>
        <img src="../logo.webp" alt="Garden Grove Village Logo" width="163" height="46" />
      </div>
      <h1 data-reveal="intro">🎁 Join MyGGV</h1>
      <p data-reveal="intro">You've been invited! Install the app, sign up, then enter the code below to both get 10 coins.</p>

      <div id="codeBlock" class="hidden">
        <div class="code-label">Your referral code</div>
        <div class="code-row">
          <div class="code" id="code">--------</div>
          <button class="copy" id="copyBtn" type="button" data-press>Copy</button>
        </div>
      </div>

      <a class="btn" id="play" href="#" data-press data-reveal="intro">Get it on Google Play</a>
      <a class="btn" id="appstore" href="#" data-press data-reveal="intro">Download on the App Store</a>

      <div class="hint" id="hint"></div>
    </main>
    <script src="../vendor/motion.js" defer></script>
    <script src="../animations.js" defer></script>
    <script src="../leaves.js" defer></script>

    <script>
      (function () {
        var PLAY = 'https://play.google.com/store/apps/details?id=com.myggv.app';
        var APPSTORE = 'https://apps.apple.com/app/myggv/id6757699416';

        var params = new URLSearchParams(location.search);
        var ref = (params.get('ref') || '').trim().toUpperCase().replace(/[^0-9A-Z]/g, '');

        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/(Mac)/i.test(ua) && 'ontouchend' in document);

        // Android : on transporte le code via le paramètre `referrer` du Play Store
        // (lu plus tard par l'app via l'Install Referrer API — sans effet si non implémenté).
        var playUrl = ref ? PLAY + '&referrer=' + encodeURIComponent('ref=' + ref) : PLAY;
        document.getElementById('play').href = playUrl;
        document.getElementById('appstore').href = APPSTORE;

        // Code + copie
        if (ref) {
          document.getElementById('code').textContent = ref;
          document.getElementById('codeBlock').classList.remove('hidden');
          document.getElementById('copyBtn').addEventListener('click', function () {
            navigator.clipboard && navigator.clipboard.writeText(ref);
            this.textContent = 'Copied';
          });
        }

        // N'affiche que le store pertinent ; sur desktop, les deux.
        var play = document.getElementById('play');
        var appstore = document.getElementById('appstore');
        var hint = document.getElementById('hint');
        if (isAndroid && !isIOS) {
          appstore.classList.add('hidden');
          hint.textContent = ref ? 'After signing up, enter your code on the Share page.' : '';
        } else if (isIOS) {
          play.classList.add('hidden');
          hint.textContent = ref ? 'Copy your code, then enter it on the Share page after signing up.' : '';
        } else {
          appstore.classList.add('btn-secondary');
        }
      })();
    </script>
  </body>
</html>
